<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Wildbrook Bevvy Burros  The herd that pours.">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3d2c"/>
      <stop offset="60%" stop-color="#1f2e21"/>
      <stop offset="100%" stop-color="#14201a"/>
    </linearGradient>
    <radialGradient id="og-glow1" cx="22%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#c66a3d" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c66a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og-glow2" cx="80%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#b89461" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#b89461" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <rect width="1200" height="630" fill="url(#og-glow1)"/>
  <rect width="1200" height="630" fill="url(#og-glow2)"/>
  <text x="80" y="120" font-family="Inter, sans-serif" font-size="20" letter-spacing="6" fill="#d8b783" font-weight="600">NORTH BEND  ·  WASHINGTON</text>
  <text x="80" y="320" font-family="Fraunces, serif" font-size="148" letter-spacing="-4" fill="#f6efe2" font-weight="500">Wildbrook</text>
  <text x="80" y="460" font-family="Fraunces, serif" font-size="148" letter-spacing="-4" fill="#f6efe2" font-style="italic" font-weight="500">Bevvy Burros.</text>
  <text x="80" y="555" font-family="Inter, sans-serif" font-size="26" fill="rgba(246,239,226,0.78)" font-weight="400">The herd that pours. Mobile beverage service from the Snoqualmie Valley.</text>
  <circle cx="1080" cy="120" r="40" fill="#c66a3d"/>
  <text x="1080" y="135" font-family="Fraunces, serif" font-size="40" text-anchor="middle" fill="#f6efe2" font-weight="500">W</text>
</svg>
